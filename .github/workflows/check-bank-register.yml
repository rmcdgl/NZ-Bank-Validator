name: Check Payments NZ bank branch coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "37 20 26 * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SNAPSHOT_BRANCH: data/payments-nz-register-history
      SNAPSHOT_DIR: bank-register-history

    steps:
      - uses: actions/checkout@v6

      - name: Checkout snapshot history
        id: snapshots
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SNAPSHOT_BRANCH }}
          path: ${{ env.SNAPSHOT_DIR }}

      - name: Initialize snapshot history
        if: steps.snapshots.outcome == 'failure'
        run: |
          rm -rf "$SNAPSHOT_DIR"
          mkdir -p "$SNAPSHOT_DIR/snapshots"

          git -C "$SNAPSHOT_DIR" init
          git -C "$SNAPSHOT_DIR" checkout --orphan "$SNAPSHOT_BRANCH"
          git -C "$SNAPSHOT_DIR" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prepare snapshot directory
        run: |
          mkdir -p "$SNAPSHOT_DIR/snapshots"

          if [ ! -f "$SNAPSHOT_DIR/README.md" ]; then
            {
              echo "# Payments NZ register history"
              echo
              echo "This branch stores derived monthly snapshots of active Payments NZ bank/branch pairs."
              echo
              echo 'It is generated by the scheduled register coverage workflow and should not be merged into `main`.'
              echo "Snapshot files intentionally contain only normalized active bank/branch IDs, not the full Payments NZ CSV."
            } > "$SNAPSHOT_DIR/README.md"
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check register coverage
        id: register
        continue-on-error: true
        run: |
          npm run check:bank-register -- \
            --report ./bank-register-report.md \
            --snapshot-dir "./$SNAPSHOT_DIR/snapshots" \
            --snapshot-index "./$SNAPSHOT_DIR/index.json"

      - name: Try safe auto-fix
        if: steps.register.outcome == 'failure'
        id: fix
        continue-on-error: true
        run: |
          npm run check:bank-register:fix -- \
            --report ./bank-register-report.md \
            --snapshot-dir "./$SNAPSHOT_DIR/snapshots" \
            --snapshot-index "./$SNAPSHOT_DIR/index.json"

      - name: Commit snapshot history
        if: always()
        run: |
          if [ ! -f "$SNAPSHOT_DIR/index.json" ]; then
            echo "No snapshot index was written; skipping snapshot branch update."
            exit 0
          fi

          git -C "$SNAPSHOT_DIR" config user.name "github-actions[bot]"
          git -C "$SNAPSHOT_DIR" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$SNAPSHOT_DIR" add README.md index.json snapshots

          if git -C "$SNAPSHOT_DIR" diff --cached --quiet; then
            echo "Snapshot history is already up to date."
            exit 0
          fi

          git -C "$SNAPSHOT_DIR" commit -m "Add Payments NZ register snapshot"
          git -C "$SNAPSHOT_DIR" push origin "HEAD:$SNAPSHOT_BRANCH"

      - name: Open PR or issue
        if: steps.register.outcome == 'failure'
        run: |
          if ! git diff --quiet; then
            branch="bot/update-bank-ranges-$(date +%Y-%m)"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git checkout -b "$branch"
            git add src/constants.ts bank-register-report.md
            git commit -m "Update Payments NZ branch range coverage"
            git push origin "$branch"

            gh pr create \
              --title "Update Payments NZ branch range coverage" \
              --body-file ./bank-register-report.md \
              --base "${GITHUB_REF_NAME}" \
              --head "$branch"

            exit 0
          fi

          gh label create bank-register \
            --description "Payments NZ branch register coverage" \
            --color "0e8a16" || true

          existing="$(gh issue list \
            --state open \
            --label bank-register \
            --search "Payments NZ bank branch range coverage needs review" \
            --json number \
            --jq '.[0].number')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file ./bank-register-report.md
          else
            gh issue create \
              --title "Payments NZ bank branch range coverage needs review" \
              --body-file ./bank-register-report.md \
              --label "bank-register"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
